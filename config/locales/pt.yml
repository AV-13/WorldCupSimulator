      title: "Cookies"
      content: "O site usa cookies técnicos essenciais para lembrar sua preferência de idioma e simulação atual. Nenhum cookie de rastreamento ou publicitário é usado."
    rights:
      title: "Seus direitos"
      content: "Suas simulações são armazenadas localmente e podem ser excluídas a qualquer momento limpando os cookies do seu navegador. Nenhum registro é necessário para usar o serviço."
    contact:
      title: "Contato"
      content_html: "Para qualquer dúvida sobre seus dados, entre em contato conosco através do <a href=\"https://github.com/AV-13/WorldCupSimulator\">GitHub</a>."

