# fly.toml - Fly.io Configuration for Mondial Simulator
# Documentation: https://fly.io/docs/reference/configuration/

app = 'mondial-simulator'
primary_region = 'cdg'  # Paris - closest to France

[build]

[deploy]
  release_command = './bin/rails db:prepare'

[env]
  RAILS_ENV = 'production'
  RAILS_LOG_TO_STDOUT = 'true'
  RAILS_SERVE_STATIC_FILES = 'true'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 25
    soft_limit = 20

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1

[mounts]
  source = 'mondial_data'
  destination = '/rails/storage'
  initial_size = '1gb'

[checks]
  [checks.status]
    port = 3000
    type = 'http'
    interval = '10s'
    timeout = '2s'
    grace_period = '5s'
    method = 'GET'
    path = '/up'
