default: &default
  store_options:
    # Cap age of oldest cache entry to fulfill retention policies
    # max_age: <%= 60.days.to_i %>
    max_size: <%= 256.megabytes %>
    namespace: <%= Rails.env %>

development:
  <<: *default

test:
  <<: *default

# Production uses memory_store (see config/environments/production.rb)
# Solid Cache disabled for Render free tier (ephemeral filesystem)
production:
  <<: *default
