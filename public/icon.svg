<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="100" height="100" fill="#ffffff"/>

  <!-- Outer frame - subtle pitch reference -->
  <rect x="10" y="10" width="80" height="80" rx="2" stroke="url(#goldGradient)" stroke-width="1" opacity="0.6"/>

  <!-- Center circle - pitch center reference -->
  <circle cx="50" cy="50" r="20" stroke="url(#goldGradient)" stroke-width="1.5" opacity="0.7"/>

  <!-- Abstract M monogram formed by intersecting lines -->
  <path d="M25 70 L25 30 L50 50 L75 30 L75 70" stroke="url(#goldGradient)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Horizontal midfield line -->
  <line x1="15" y1="50" x2="85" y2="50" stroke="url(#goldGradient)" stroke-width="1" opacity="0.4"/>

  <!-- Penalty arc suggestions -->
  <path d="M35 25 Q50 35, 65 25" stroke="url(#goldGradient)" stroke-width="1" fill="none" opacity="0.5"/>
  <path d="M35 75 Q50 65, 65 75" stroke="url(#goldGradient)" stroke-width="1" fill="none" opacity="0.5"/>

  <!-- Corner flag accents -->
  <circle cx="15" cy="15" r="3" fill="url(#goldGradient)" opacity="0.6"/>
  <circle cx="85" cy="15" r="3" fill="url(#goldGradient)" opacity="0.6"/>
  <circle cx="15" cy="85" r="3" fill="url(#goldGradient)" opacity="0.6"/>
  <circle cx="85" cy="85" r="3" fill="url(#goldGradient)" opacity="0.6"/>

  <!-- Gradient definition - darker for white background -->
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6b5a45"/>
      <stop offset="50%" stop-color="#8b7355"/>
      <stop offset="100%" stop-color="#6b5a45"/>
    </linearGradient>
  </defs>
</svg>
