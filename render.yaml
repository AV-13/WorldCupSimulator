# Render Blueprint - World Cup Simulator
# https://render.com/docs/blueprint-spec

databases:
  - name: worldcup-db
    plan: free
    databaseName: worldcup_production
    user: worldcup

services:
  - type: web
    name: worldcup-simulator
    plan: free
    runtime: ruby
    buildCommand: ./bin/render-build.sh
    startCommand: bundle exec puma -C config/puma.rb
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: worldcup-db
          property: connectionString
      - key: RAILS_ENV
        value: production
      - key: RAILS_MASTER_KEY
        sync: false  # Set manually in Render dashboard
      - key: RAILS_LOG_TO_STDOUT
        value: "true"
      - key: RAILS_SERVE_STATIC_FILES
        value: "true"
