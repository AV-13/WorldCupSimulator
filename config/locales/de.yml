  legal:
    title: "Impressum"
    back: "Zurück zur Startseite"
    editor:
      title: "Herausgeber"
      content: "Diese Website ist ein persönliches, nicht kommerzielles Projekt, das von einer Privatperson entwickelt wurde. Es handelt sich um einen inoffiziellen Turniersimulator, der in keiner Weise mit der FIFA oder einer anderen offiziellen Organisation verbunden ist."
    hosting:
      title: "Hosting"
      content: "Informationen zum Hosting werden in Kürze bereitgestellt."
    intellectual_property:
      title: "Geistiges Eigentum"
      content: "Der Quellcode dieses Projekts ist als Open Source verfügbar. Die verwendeten Flaggen und Bilder stammen aus lizenzfreien Quellen. Team- und Spielernamen werden nur zu Informationszwecken verwendet. FIFA und World Cup sind eingetragene Marken ihrer jeweiligen Eigentümer."
    disclaimer:
      title: "Haftungsausschluss"
      content: "Dieser Simulator wird nur zu Informations- und Unterhaltungszwecken bereitgestellt. Die generierten Vorhersagen haben keinen offiziellen Wert und stellen nicht die tatsächlichen Ergebnisse von Wettbewerben dar."
    contact:
      title: "Kontakt"
      content_html: "Bei Fragen können Sie uns über <a href=\"https://github.com/AV-13/WorldCupSimulator\">GitHub</a> kontaktieren."

  privacy:
    title: "Datenschutz"
    back: "Zurück zur Startseite"
    intro:
      title: "Einleitung"
      content: "Diese Datenschutzrichtlinie erklärt, wie wir Daten bei der Nutzung von Mondial Simulator verarbeiten."
    data_collected:
      title: "Erfasste Daten"
      content: "Wir erfassen nur die für den Betrieb des Simulators unbedingt erforderlichen Daten:"
      items:
        - "Simulationskennung (zufällig generierter eindeutiger Token)"
        - "Spracheinstellungen"
        - "In der Simulation gespeicherte Spielvorhersagen"
    data_usage:
      title: "Datennutzung"
      content: "Die Daten werden ausschließlich verwendet, um den Betrieb des Simulators zu ermöglichen und Ihre Vorhersagen zu speichern. Es werden keine persönlichen Daten erfasst, verkauft oder an Dritte weitergegeben."
    cookies:
      title: "Cookies"
      content: "Die Website verwendet technisch notwendige Cookies, um Ihre Spracheinstellung und aktuelle Simulation zu speichern. Es werden keine Tracking- oder Werbe-Cookies verwendet."
    rights:
      title: "Ihre Rechte"
      content: "Ihre Simulationen werden lokal gespeichert und können jederzeit durch Löschen der Browser-Cookies entfernt werden. Zur Nutzung des Dienstes ist keine Registrierung erforderlich."
    contact:
      title: "Kontakt"
      content_html: "Bei Fragen zu Ihren Daten kontaktieren Sie uns bitte über <a href=\"https://github.com/AV-13/WorldCupSimulator\">GitHub</a>."

