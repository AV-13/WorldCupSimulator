      title: "Cookies"
      content: "Le site utilise des cookies techniques essentiels pour mémoriser votre préférence de langue et votre simulation en cours. Aucun cookie de tracking ou publicitaire n'est utilisé."
    rights:
      title: "Vos droits"
      content: "Vos simulations sont stockées localement et peuvent être supprimées à tout moment en effaçant les cookies de votre navigateur. Aucune inscription n'est requise pour utiliser le service."
